<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Summarizer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <div>
        <h1>Page Summarizer</h1>
        <p class="subtitle">Your saved summaries</p>
      </div>
    </header>

    <section class="settings-panel">
      <label class="field-label" for="api-key">OpenAI API key</label>
      <input
        type="password"
        id="api-key"
        class="field-input"
        placeholder="sk-..."
        autocomplete="off"
      />

      <label class="field-label" for="model-select">Model</label>
      <select id="model-select" class="field-select">
        <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        <option value="gpt-4.1">gpt-4.1</option>
        <option value="gpt-5.6">gpt-5.6</option>
      </select>

      <div class="settings-actions">
        <button class="btn-save-settings" id="save-settings">Save settings</button>
        <span class="settings-status" id="settings-status"></span>
      </div>
    </section>

    <div class="popup-toolbar">
      <span class="count" id="summary-count">0 summaries</span>
      <button class="btn-clear" id="clear-all" title="Clear all summaries">Clear all</button>
    </div>

    <main class="summary-list" id="summary-list">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 12h6M9 16h6M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/>
        </svg>
        <p>No summaries yet</p>
        <span>Click the floating button on any page to summarize</span>
      </div>
    </main>

    <footer class="popup-footer">
      <span>v2.0.0</span>
      <span class="badge" id="model-badge">gpt-4o-mini</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
