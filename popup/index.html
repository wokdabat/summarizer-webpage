<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page and YouTube Summarizer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <div>
        <h1>Page and YouTube Summarizer</h1>
        <p class="subtitle">Your saved summaries</p>
      </div>
    </header>

    <section class="settings-panel">
      <div class="field-group">
        <label class="field-label" for="api-key-input">OpenAI API Key</label>
        <div class="field-input-row">
          <input
            type="password"
            id="api-key-input"
            class="field-input"
            autocomplete="off"
            spellcheck="false"
            placeholder="sk-..."
          />
          <button type="button" class="btn-toggle-key" id="toggle-api-key" title="Show key">Show</button>
        </div>
        <p class="field-hint">
          Stored locally on your device. Used only for OpenAI requests.
          <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">Get a key</a>
        </p>
        <div class="api-key-actions">
          <span class="api-key-status hidden" id="api-key-status">Key saved</span>
          <button type="button" class="btn-remove-key hidden" id="remove-api-key">Remove key</button>
        </div>
      </div>

      <div class="field-group">
      <label class="field-label" for="model-select">Model Selection</label>
      <select id="model-select" class="field-select">
        <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        <option value="gpt-4.1">gpt-4.1</option>
        <option value="gpt-5.6">gpt-5.6</option>
      </select>
      </div>

      <div class="settings-actions">
        <button class="btn-save-settings" id="save-settings">Save settings</button>
        <span class="settings-status" id="settings-status"></span>
      </div>
    </section>

    <div class="popup-toolbar">
      <span class="count" id="summary-count">0 summaries</span>
      <button class="btn-clear" id="clear-all" title="Clear all summaries">Clear all</button>
    </div>

    <main class="summary-list" id="summary-list">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 12h6M9 16h6M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/>
        </svg>
        <p>No summaries yet</p>
        <span>Click the floating button on any page to summarize</span>
      </div>
    </main>

    <footer class="popup-footer">
      <span>v2.1.0</span>
      <span class="badge" id="model-badge">gpt-4o-mini</span>
    </footer>

    <div class="download-notice hidden" id="download-notice" role="dialog" aria-labelledby="download-notice-title">
      <div class="download-notice-card">
        <p class="download-notice-title" id="download-notice-title">PDF downloaded</p>
        <p class="download-notice-file" id="download-notice-file"></p>
        <p class="download-notice-hint" id="download-notice-hint">Your PDF was saved.</p>
        <button class="download-notice-close" id="download-notice-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="../lib/jspdf.umd.min.js"></script>
  <script src="pdf.js"></script>
  <script src="popup.js"></script>
</body>
</html>
